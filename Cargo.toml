[package]
name = "mgit"
version = "0.1.0"
edition = "2021"
description = "A minimal, Git-compatible version control system written from scratch in Rust"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
